# Marq Living broker. Every client authenticates; topics are limited by ACL.
persistence true
persistence_location /mosquitto/data/
log_dest stdout
log_type error
log_type warning
log_type notice

per_listener_settings false
allow_anonymous false
password_file /mosquitto/config/passwd
acl_file /mosquitto/config/acl

# Inside the Docker network / building VLAN.
listener 1883

# Production: TLS for devices on the building network. Put the certificate
# and key in ./certs and uncomment.
# listener 8883
# cafile /mosquitto/config/certs/ca.crt
# certfile /mosquitto/config/certs/server.crt
# keyfile /mosquitto/config/certs/server.key
# require_certificate false

max_queued_messages 10000
message_size_limit 65536
