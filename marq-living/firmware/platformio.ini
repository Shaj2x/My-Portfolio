; Marq Living node firmware (ESP32, Arduino framework).
;   pio run -e ct_node -t upload        # CT clamp metering node
;   pio run -e room_node -t upload      # PIR + relays (lights/HVAC) node
;   make -C test/host                   # unit tests for the core logic (no hardware)
; Copy include/config.example.h to include/config.h first.

[env]
platform = espressif32@6.9.0
board = esp32dev
framework = arduino
monitor_speed = 115200
board_build.filesystem = littlefs
board_build.partitions = min_spiffs.csv   ; two OTA slots + LittleFS
lib_deps =
  knolleary/PubSubClient@^2.8
  bblanchon/ArduinoJson@^7.2.0
build_flags =
  -std=gnu++17
  -DMQTT_MAX_PACKET_SIZE=1024
build_unflags = -std=gnu++11

[env:ct_node]
build_flags = ${env.build_flags} -DMARQ_NODE_CT=1

[env:room_node]
build_flags = ${env.build_flags} -DMARQ_NODE_ROOM=1
