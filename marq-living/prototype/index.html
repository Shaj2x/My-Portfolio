<title>Marq Living Prototype</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F4F1EA; --app-bg:#F8F6F1; --surface:#FFFFFF; --surface-2:#F6F3EC; --text:#1A2133; --muted:#5D6575; --faint:#8A909C;
  --border:#E3DDD0; --primary:#1D2C4D; --on-primary:#FFFFFF; --accent:#A47D43; --accent-strong:#8A6630; --accent-soft:#F3E9D6;
  --ok:#2C7A4B; --ok-soft:#E2F1E7; --warn:#9A6210; --warn-soft:#FBEFD8; --bad:#B03838; --bad-soft:#F8E0E0; --info:#2C5AA0; --info-soft:#E1E9F6;
  --s1:#2F5D9E; --s2:#C0883A; --s3:#2F8C7A; --s4:#8B5BA8; --s5:#9AA2B1;
  --map-bg:#EEF0EA; --map-street:#DADDD4; --map-water:#BFD5E6; --map-park:#DCE8D3;
  --shadow:0 1px 2px rgba(20,25,40,.05),0 6px 20px rgba(20,25,40,.06); --shadow-lg:0 2px 6px rgba(20,25,40,.06),0 24px 60px rgba(20,25,40,.14);
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0E131D; --app-bg:#111827; --surface:#172033; --surface-2:#1C2639; --text:#ECE8DF; --muted:#A3AABA; --faint:#7A8294;
    --border:#2A3549; --primary:#D2AE70; --on-primary:#171D2B; --accent:#D2AE70; --accent-strong:#E0BF86; --accent-soft:#2D2A23;
    --ok:#62C08A; --ok-soft:#173226; --warn:#E3AA50; --warn-soft:#352816; --bad:#EE7B7B; --bad-soft:#3A1D21; --info:#7FA7E6; --info-soft:#1B2944;
    --s1:#6F9BE0; --s2:#E0A957; --s3:#4FC0A8; --s4:#B88AD6; --s5:#7D8699;
    --map-bg:#1A2232; --map-street:#263048; --map-water:#1F3A57; --map-park:#1D3027;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.25); --shadow-lg:0 2px 6px rgba(0,0,0,.35),0 24px 60px rgba(0,0,0,.45);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0E131D; --app-bg:#111827; --surface:#172033; --surface-2:#1C2639; --text:#ECE8DF; --muted:#A3AABA; --faint:#7A8294;
  --border:#2A3549; --primary:#D2AE70; --on-primary:#171D2B; --accent:#D2AE70; --accent-strong:#E0BF86; --accent-soft:#2D2A23;
  --ok:#62C08A; --ok-soft:#173226; --warn:#E3AA50; --warn-soft:#352816; --bad:#EE7B7B; --bad-soft:#3A1D21; --info:#7FA7E6; --info-soft:#1B2944;
  --s1:#6F9BE0; --s2:#E0A957; --s3:#4FC0A8; --s4:#B88AD6; --s5:#7D8699;
  --map-bg:#1A2232; --map-street:#263048; --map-water:#1F3A57; --map-park:#1D3027;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.25); --shadow-lg:0 2px 6px rgba(0,0,0,.35),0 24px 60px rgba(0,0,0,.45);
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--text);font:14px/1.45 Inter,system-ui,-apple-system,sans-serif;-webkit-font-smoothing:antialiased;overflow-x:hidden}
h1,h2,h3{font-family:Fraunces,Georgia,serif;font-weight:600;margin:0;letter-spacing:-.01em;line-height:1.2}
h1{font-size:24px} h2{font-size:20px} h3{font-size:16px}
p{margin:0}
button{font:inherit;color:inherit;cursor:pointer}
input,select,textarea{font:inherit;color:var(--text);background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:9px 11px;width:100%;min-width:0}
textarea{resize:vertical;min-height:84px}
input:focus,select:focus,textarea:focus,button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
label.f{display:block;font-size:12px;font-weight:600;color:var(--muted);margin:0 0 5px}
.i{width:18px;height:18px;flex:none}
.muted{color:var(--muted)} .faint{color:var(--faint)} .small{font-size:12px} .tiny{font-size:11px}
.num{font-variant-numeric:tabular-nums}
.row{display:flex;align-items:center;gap:8px}
.row.wrap{flex-wrap:wrap} .row.between{justify-content:space-between} .row.top{align-items:flex-start}
.stack{display:flex;flex-direction:column;gap:12px}
.stack.sm{gap:8px}
.grow{flex:1;min-width:0}
.mt{margin-top:16px} .mt-s{margin-top:8px}
.ellipsis{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* top bar */
.topbar{position:sticky;top:0;z-index:30;background:color-mix(in srgb,var(--bg) 90%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--border)}
.topbar-in{max-width:1320px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;margin-right:auto;min-width:0}
.brand b{font-family:Fraunces,Georgia,serif;font-size:18px;font-weight:600;letter-spacing:-.01em}
.mark{width:34px;height:34px;border-radius:9px;background:#1D2C4D;display:grid;place-items:center;flex:none}
.proto{font-size:11px;font-weight:600;color:var(--accent-strong);background:var(--accent-soft);border-radius:999px;padding:2px 8px;white-space:nowrap}
.seg{display:inline-flex;background:var(--surface);border:1px solid var(--border);border-radius:999px;padding:3px;max-width:100%;overflow-x:auto}
.seg button{border:0;background:transparent;padding:6px 13px;border-radius:999px;color:var(--muted);font-weight:500;white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--primary);color:var(--on-primary)}
.iconbtn{border:1px solid var(--border);background:var(--surface);border-radius:999px;width:36px;height:36px;display:grid;place-items:center;flex:none}

.wrap{max-width:1320px;margin:0 auto;padding:20px 16px 56px}

/* cards & bits */
.card{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:16px;box-shadow:var(--shadow)}
.card.flat{box-shadow:none}
.card.tight{padding:12px}
.card.link{display:block;width:100%;text-align:left;border:1px solid var(--border)}
.card.link:hover{border-color:var(--accent)}
.card h3{margin-bottom:2px}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:600;padding:2px 9px;border-radius:999px;background:var(--surface-2);color:var(--muted);white-space:nowrap;border:0}
.chip.ok{background:var(--ok-soft);color:var(--ok)} .chip.warn{background:var(--warn-soft);color:var(--warn)}
.chip.bad{background:var(--bad-soft);color:var(--bad)} .chip.info{background:var(--info-soft);color:var(--info)}
.chip.brass{background:var(--accent-soft);color:var(--accent-strong)}
button.chip{cursor:pointer;padding:5px 12px;font-size:12.5px;border:1px solid var(--border);background:var(--surface)}
button.chip[aria-pressed="true"]{background:var(--primary);color:var(--on-primary);border-color:var(--primary)}
.dot{width:8px;height:8px;border-radius:50%;background:var(--faint);display:inline-block;flex:none}
.dot.ok{background:var(--ok)} .dot.warn{background:var(--warn)} .dot.bad{background:var(--bad)}
.dot.live{background:var(--ok);box-shadow:0 0 0 0 var(--ok);animation:pulse 1.8s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--ok) 60%,transparent)}70%{box-shadow:0 0 0 8px transparent}100%{box-shadow:0 0 0 0 transparent}}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--border);background:var(--surface);border-radius:10px;padding:9px 14px;font-weight:600;white-space:nowrap}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--primary);color:var(--on-primary);border-color:var(--primary)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.danger{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 40%,var(--border))}
.btn.ghost{border-color:transparent;background:transparent}
.btn.sm{padding:6px 10px;font-size:12.5px;border-radius:8px}
.btn.block{width:100%}
.btn.lg{padding:14px 18px;font-size:16px;border-radius:14px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.switch{width:40px;height:24px;border-radius:999px;border:0;background:var(--border);position:relative;flex:none;padding:0}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:#fff;transition:transform .15s;box-shadow:0 1px 2px rgba(0,0,0,.25)}
.switch[aria-pressed="true"]{background:var(--ok)}
.switch[aria-pressed="true"]::after{transform:translateX(16px)}
.banner{display:flex;gap:10px;align-items:flex-start;padding:11px 13px;border-radius:12px;background:var(--warn-soft);color:var(--warn);font-weight:500}
.banner.bad{background:var(--bad-soft);color:var(--bad)}
.banner.info{background:var(--info-soft);color:var(--info)}
.banner .i{margin-top:1px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 14px}
.kv dt{color:var(--muted)} .kv dd{margin:0;font-weight:500}
.list{display:flex;flex-direction:column}
.list > *{padding:11px 0;border-top:1px solid var(--border)}
.list > *:first-child{border-top:0}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;gap:8px;margin:20px 0 8px}
.sec-h h3{font-size:15px}
.empty{padding:22px;text-align:center;color:var(--muted);border:1px dashed var(--border);border-radius:12px}
hr.sep{border:0;border-top:1px solid var(--border);margin:14px 0}

/* resident & driver phone */
.res-layout{display:grid;grid-template-columns:minmax(0,410px) minmax(0,330px);gap:32px;justify-content:center;align-items:start}
.phone{background:var(--app-bg);border:1px solid var(--border);border-radius:34px;box-shadow:var(--shadow-lg);overflow:hidden;display:flex;flex-direction:column;height:min(820px,calc(100vh - 100px));min-height:600px;position:relative}
.phone-head{padding:14px 18px 10px;display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--border);background:var(--surface)}
.phone-body{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:12px}
.tabbar{display:grid;grid-template-columns:repeat(5,1fr);border-top:1px solid var(--border);background:var(--surface);padding-bottom:4px}
.tabbar button{border:0;background:none;padding:9px 0 7px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;color:var(--muted);position:relative}
.tabbar button[aria-current="page"]{color:var(--accent-strong);font-weight:600}
.tabbar .badge{position:absolute;top:4px;left:calc(50% + 6px)}
.badge{min-width:17px;height:17px;padding:0 5px;border-radius:999px;background:var(--bad);color:#fff;font-size:10.5px;font-weight:700;display:inline-grid;place-items:center}
.side-notes{position:sticky;top:84px}
.side-notes ol{margin:8px 0 0;padding-left:18px;display:flex;flex-direction:column;gap:6px}
.hello{background:linear-gradient(135deg,#1D2C4D,#2A3D66);color:#F3EEE3;border:0}
.hello .muted{color:#C8CEDB}
.hello h2{font-size:24px;color:#fff}
.hello .chip.ok{background:rgba(255,255,255,.14);color:#E9D9B8}
.big-eta{font-family:Fraunces,Georgia,serif;font-size:30px;font-weight:600;line-height:1}
.tile-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.back{display:inline-flex;align-items:center;gap:4px;border:0;background:none;color:var(--accent-strong);font-weight:600;padding:0}
.map{width:100%;height:auto;display:block;border-radius:12px}
.stop-row{display:flex;align-items:center;gap:10px}
.stop-row .pin{width:12px;height:12px;border-radius:50%;border:3px solid var(--accent);background:var(--surface);flex:none}
.stop-row.home .pin{border-color:var(--primary);background:var(--primary)}
.machines{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.machine{min-width:0;border:1px solid var(--border);border-radius:14px;padding:12px;background:var(--surface);display:flex;flex-direction:column;gap:6px}
.machine.free{border-color:color-mix(in srgb,var(--ok) 45%,var(--border))}
.machine.fault{background:var(--surface-2)}
.machine .row{flex-wrap:wrap;gap:4px 8px}
.mbar{height:5px;border-radius:999px;background:var(--surface-2);overflow:hidden}
.mbar > i{display:block;height:100%;background:var(--accent)}
.slots{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.slot{border:1px solid var(--border);background:var(--surface);border-radius:9px;padding:8px 0;font-size:12.5px;font-weight:600;text-align:center}
.slot[disabled]{color:var(--faint);background:var(--surface-2);text-decoration:line-through;cursor:not-allowed}
.slot.mine{background:var(--info-soft);color:var(--info);border-color:transparent;text-decoration:none}
.slot.sel{background:var(--primary);color:var(--on-primary);border-color:var(--primary)}
.days{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px}
.days button{flex:none;border:1px solid var(--border);background:var(--surface);border-radius:12px;padding:7px 10px;text-align:center;min-width:52px}
.days button b{display:block;font-size:16px}
.days button[aria-pressed="true"]{background:var(--primary);color:var(--on-primary);border-color:var(--primary)}
.msg{padding:10px 12px;border-radius:12px;background:var(--surface-2);max-width:88%}
.msg.me{align-self:flex-end;background:var(--info-soft)}
.msg.internal{background:var(--warn-soft);border:1px dashed color-mix(in srgb,var(--warn) 50%,transparent)}
.drv-big{font-family:Fraunces,Georgia,serif;font-size:26px;font-weight:600}
.gps{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--muted)}

/* staff */
.staff{display:grid;grid-template-columns:220px minmax(0,1fr);gap:24px;align-items:start}
.snav{position:sticky;top:76px;display:flex;flex-direction:column;gap:2px}
.snav button{display:flex;align-items:center;gap:10px;border:0;background:none;padding:8px 10px;border-radius:10px;color:var(--muted);font-weight:500;text-align:left}
.snav button:hover{background:var(--surface)}
.snav button[aria-current="page"]{background:var(--surface);color:var(--text);box-shadow:var(--shadow)}
.snav button[aria-current="page"] .i{color:var(--accent)}
.snav .badge{margin-left:auto}
.snav .who{padding:10px;margin-bottom:6px;border-bottom:1px solid var(--border)}
.page-h{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.page-h p{margin-top:3px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}
.kpi .v{font-family:Fraunces,Georgia,serif;font-size:26px;font-weight:600;line-height:1.1;margin-top:4px}
.kpi .l{font-size:12px;color:var(--muted);font-weight:500}
.grid2{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:16px}
.grid2.even{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
.tbl-wrap{overflow-x:auto;margin:0 -16px;padding:0 16px}
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;font-size:11.5px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);font-weight:600;padding:8px 10px;border-bottom:1px solid var(--border);white-space:nowrap}
td{padding:10px;border-bottom:1px solid var(--border);vertical-align:middle}
tr:last-child td{border-bottom:0}
tr.sel td{background:var(--surface-2)}
.meter{height:10px;border-radius:999px;background:var(--surface-2);overflow:hidden;position:relative}
.meter > i{display:block;height:100%;border-radius:999px;background:var(--s1)}
.meter.warn > i{background:var(--warn)}
.bars{display:flex;flex-direction:column;gap:9px}
.bar{display:grid;grid-template-columns:minmax(90px,140px) 1fr auto;gap:10px;align-items:center;font-size:13px}
.bar .t{height:10px;border-radius:999px;background:var(--surface-2);overflow:hidden}
.bar .t > i{display:block;height:100%;border-radius:999px}
.cols{display:flex;align-items:flex-end;gap:6px;height:150px;padding-top:18px}
.cols .c{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;height:100%;justify-content:flex-end;min-width:0}
.cols .c i{display:block;width:100%;max-width:34px;border-radius:6px 6px 2px 2px;background:var(--s1)}
.cols .c span{font-size:10.5px;color:var(--muted);white-space:nowrap}
.cols .c em{font-style:normal;font-size:10.5px;font-weight:600}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:10px;height:10px;border-radius:3px;display:inline-block}
.chart{width:100%;height:auto;display:block}
.chart text{fill:var(--muted);font-size:11px;font-family:Inter,system-ui,sans-serif}
.room{display:flex;flex-direction:column;gap:10px}
.state-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.state-grid > div{background:var(--surface-2);border-radius:10px;padding:8px 10px}
.state-grid b{display:block;font-size:14px}
.timeline{position:relative;height:30px;border-radius:8px;background:var(--surface-2);overflow:hidden}
.timeline .blk{position:absolute;top:4px;bottom:4px;border-radius:6px;font-size:11px;font-weight:600;color:#fff;display:flex;align-items:center;padding:0 6px;white-space:nowrap;overflow:hidden}
.tl-axis{display:flex;justify-content:space-between;font-size:10.5px;color:var(--muted);margin-top:4px}
.rule{display:flex;gap:12px;align-items:flex-start}
.rule .when{font-weight:600}
.code{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px}
.note{font-size:12.5px;color:var(--muted);background:var(--surface-2);border-radius:10px;padding:10px 12px}

/* modal & toasts */
#modal{position:fixed;inset:0;z-index:60;display:none;place-items:center;background:rgba(10,14,24,.5);padding:16px}
#modal.open{display:grid}
.dialog{background:var(--surface);border-radius:18px;max-width:520px;width:100%;max-height:calc(100vh - 32px);overflow:auto;padding:20px;box-shadow:var(--shadow-lg)}
#toasts{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);z-index:70;display:flex;flex-direction:column;gap:8px;width:min(420px,calc(100vw - 32px))}
.toast{background:var(--primary);color:var(--on-primary);padding:11px 14px;border-radius:12px;box-shadow:var(--shadow-lg);font-weight:500;display:flex;gap:8px;align-items:flex-start;animation:tin .2s ease-out}
@keyframes tin{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

@media (max-width:980px){
  .staff{grid-template-columns:minmax(0,1fr)}
  .snav{position:static;flex-direction:row;overflow-x:auto;gap:4px;padding-bottom:4px;margin:0 -16px;padding-left:16px;padding-right:16px}
  .snav .who{display:none}
  .snav button{flex:none;white-space:nowrap;padding:7px 11px;border:1px solid var(--border);background:var(--surface)}
  .snav .badge{margin-left:2px}
  .grid2,.grid2.even{grid-template-columns:minmax(0,1fr)}
}
@media (max-width:820px){
  .res-layout{grid-template-columns:minmax(0,1fr);gap:20px}
  .side-notes{position:static}
  .phone{height:auto;min-height:0;border-radius:22px;overflow:visible}
  .phone-body{overflow:visible}
  .tabbar{position:sticky;bottom:0;border-radius:0 0 22px 22px;z-index:5}
}
@media (max-width:520px){
  .brand small{display:none}
  .wrap{padding-top:14px}
  .state-grid{grid-template-columns:repeat(2,1fr)}
  .bar{grid-template-columns:minmax(70px,100px) 1fr auto}
}
</style>

<div id="app"></div>
<div id="modal" role="dialog" aria-modal="true"></div>
<div id="toasts" aria-live="polite"></div>

<script>
/* ===== icons ===== */
const IC = {
  home:'M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z',
  bus:'M6 18V6a3 3 0 0 1 3-3h6a3 3 0 0 1 3 3v12zM6 12h12M8 21v-3M16 21v-3M9 15h.01M15 15h.01',
  cal:'M4 6h16v14H4zM4 10h16M8 3v4M16 3v4',
  washer:'M5 3h14v18H5zM5 7h14M8 5h.01M12 18a4 4 0 1 0 0-8 4 4 0 0 0 0 8z',
  more:'M4 4h6v6H4zM14 4h6v6h-6zM4 14h6v6H4zM14 14h6v6h-6z',
  bell:'M6 16v-5a6 6 0 0 1 12 0v5l2 2H4zM10 21a2 2 0 0 0 4 0',

/* ===== energy model (mock) ===== */
const bump = (h, c, w) => Math.exp(-((h - c) ** 2) / (2 * w * w));
const noise = i => (Math.sin(i * 12.9898) * 43758.5453) % 1;
const SYS = [
  {name:'HVAC & common', color:'var(--s1)', f:h => 34 + 10*Math.sin((h-10)/24*2*Math.PI) + (h>=7 && h<23 ? 8 : 0)},
  {name:'Laundry', color:'var(--s2)', f:h => 1.5 + (h>=8 && h<23 ? 11*bump(h,19.5,2.2) + 7*bump(h,10.5,1.6) : 0)},
  {name:'EV charging', color:'var(--s3)', f:h => (h>=23 || h<5.5) ? 21 : (h>=16.5 && h<19.5 ? 7 : 0)},
  {name:'Amenity rooms', color:'var(--s4)', f:h => (h>=18 && h<23.5) ? 4.5 : 0.7},
  {name:'Other', color:'var(--s5)', f:h => 13 + 6*bump(h,7.8,1.3) + 9*bump(h,19,2.4)},
];
const LIMIT = 150;
const price = h => (h >= 23 || h < 7) ? 0.028 : (h >= 16 && h < 21) ? 0.284 : 0.122; // ULO-style ¢/kWh → $/kWh
function energyDay(){
  const n = 96, nowIdx = Math.min(95, Math.floor(nowH() * 4));
  const series = SYS.map((s, k) => ({...s, data:Array.from({length:n}, (_, i) => i <= nowIdx ? Math.max(0, s.f(i/4) * (1 + 0.06*noise(i + k*97))) : null)}));
  const forecast = Array.from({length:n}, (_, i) => SYS.reduce((a, s) => a + s.f(i/4), 0) * 1.015);
  let kwh = 0, cost = 0, peak = 0;
  for (let i = 0; i <= nowIdx; i++) { const t = series.reduce((a, s) => a + s.data[i], 0); kwh += t/4; cost += t/4 * price(i/4); peak = Math.max(peak, t); }
  const bySys = series.map(s => ({label:s.name, color:s.color, value:s.data.reduce((a, v) => a + (v || 0), 0)/4}));
  return {n, nowIdx, series, forecast, kwh, cost, peak, bySys};
}

/* ===== charts ===== */
function areaChart({series, n, forecast, limit, nowIdx, h = 240}){
  const W = 680, H = h, pl = 38, pr = 12, pt = 12, pb = 24;
  const tot = i => series.reduce((a, s) => a + (s.data[i] || 0), 0);
  let max = Math.max(limit || 0, ...forecast);
  for (let i = 0; i <= nowIdx; i++) max = Math.max(max, tot(i));
  max = Math.ceil(max * 1.08 / 20) * 20;
  const x = i => pl + i * (W - pl - pr) / (n - 1), y = v => pt + (H - pt - pb) * (1 - v / max);
  let out = `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Building load by system">`;
  for (let k = 0; k <= 4; k++) { const v = max * k / 4; out += `<line x1="${pl}" x2="${W-pr}" y1="${y(v)}" y2="${y(v)}" stroke="var(--border)"/><text x="${pl-6}" y="${y(v)+4}" text-anchor="end">${Math.round(v)}</text>`; }
  for (let hh = 0; hh <= 24; hh += 4) { const i = Math.min(n-1, hh*4); out += `<text x="${x(i)}" y="${H-6}" text-anchor="middle">${hh === 24 ? '' : hLabel(hh).replace(' ', '')}</text>`; }
  const base = Array(n).fill(0);
  series.forEach(s => {
    const top = base.map((b, i) => b + (s.data[i] || 0));
    let d = '';
    for (let i = 0; i <= nowIdx; i++) d += `${i ? 'L' : 'M'}${x(i).toFixed(1)} ${y(top[i]).toFixed(1)}`;
    for (let i = nowIdx; i >= 0; i--) d += `L${x(i).toFixed(1)} ${y(base[i]).toFixed(1)}`;
    out += `<path d="${d}Z" fill="${s.color}" fill-opacity=".85"/>`;
    for (let i = 0; i <= nowIdx; i++) base[i] = top[i];
  });
  let fd = ''; forecast.forEach((v, i) => fd += `${i ? 'L' : 'M'}${x(i).toFixed(1)} ${y(v).toFixed(1)}`);
  out += `<path d="${fd}" fill="none" stroke="var(--text)" stroke-opacity=".55" stroke-width="1.6" stroke-dasharray="4 4"/>`;
  if (limit) out += `<line x1="${pl}" x2="${W-pr}" y1="${y(limit)}" y2="${y(limit)}" stroke="var(--bad)" stroke-width="1.5" stroke-dasharray="6 4"/><text x="${W-pr}" y="${y(limit)-5}" text-anchor="end" style="fill:var(--bad)">Peak limit ${limit} kW</text>`;
  out += `<line x1="${x(nowIdx)}" x2="${x(nowIdx)}" y1="${pt}" y2="${H-pb}" stroke="var(--accent)" stroke-width="1.5"/><text x="${x(nowIdx)+4}" y="${pt+10}" style="fill:var(--accent-strong);font-weight:600">now</text>`;
  return out + '</svg>';
}
const legend = items => `<div class="legend">${items.map(s => `<span><i style="background:${s.color}"></i>${esc(s.name)}</span>`).join('')}</div>`;
function bars(items, fmt = v => n0(v), color = 'var(--s1)'){
  const max = Math.max(...items.map(i => i.value), 1);
  return `<div class="bars">${items.map(i => `<div class="bar"><span class="ellipsis">${esc(i.label)}</span><div class="t"><i style="width:${(i.value/max*100).toFixed(1)}%;background:${i.color || color}"></i></div><b class="num">${fmt(i.value)}</b></div>`).join('')}</div>`;
}
function cols(items, fmt = v => n0(v), color = 'var(--s1)', max){
  max = max || Math.max(...items.map(i => i.value), 1);
  return `<div class="cols">${items.map(i => `<div class="c"><em class="num">${fmt(i.value)}</em><i style="height:${Math.max(2, i.value/max*100).toFixed(1)}%;background:${i.color || color}"></i><span>${esc(i.label)}</span></div>`).join('')}</div>`;
}
function spark(data, color = 'var(--s1)', w = 200, h = 44){
  const max = Math.max(...data), min = Math.min(...data);
  const d = data.map((v, i) => `${i ? 'L' : 'M'}${(i*(w/(data.length-1))).toFixed(1)} ${(h - 3 - (v-min)/(max-min || 1)*(h-6)).toFixed(1)}`).join('');
  return `<svg class="chart" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none" style="height:${h}px"><path d="${d}" fill="none" stroke="${color}" stroke-width="2"/></svg>`;
}

/* ===== shuttle model ===== */
function etaMin(i){
  const sh = S.shuttle; if (!sh.running) return null;
  const frac = (((STOPS[i].at - sh.p) % 1) + 1) % 1;
  return frac * LOOP_MIN + sh.delay;
}
const etaText = m => m == null ? '—' : m < 1 ? 'Now' : `${Math.round(m)} min`;
function nextStopIdx(){ const p = S.shuttle.p; let best = 0, bf = 2; STOPS.forEach((s, i) => { const f = (((s.at - p) % 1) + 1) % 1; if (f > 0.004 && f < bf) { bf = f; best = i; } }); return best; }
function departures(n = 4){
  const out = [], d = new Date(); let h = 7.5;
  while (out.length < n && h <= 22) { if (h > nowH()) out.push(h); h += 0.5; }
  if (out.length < n) { h = 7.5; while (out.length < n) { out.push(h + 24); h += 0.5; } }
  return out.map(x => (x >= 24 ? 'Tomorrow ' : '') + hmLabel(x % 24));
}

modal.addEventListener('click', e => { if (e.target === modal) closeModal(); });
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });
function toast(msg, ic = 'check'){
  const el = document.createElement('div'); el.className = 'toast'; el.innerHTML = icon(ic) + `<span>${msg}</span>`;

}

  stab: el => { S.stab = el.dataset.v; if (el.dataset.ticket) { S.stTicket = el.dataset.ticket; S.tkFilter = 'open'; } render(); window.scrollTo(0, 0); },
  approve: el => { const p = S.pending.find(x => String(x.id) === el.dataset.id); S.pending = S.pending.filter(x => x !== p); S.residents.unshift({name:p.name, unit:p.unit + p.room, floor:p.floor, status:'approved', joined:'Today'}); render(); toast(`${p.name} approved. They've been emailed.`); },
  decline: el => { const p = S.pending.find(x => String(x.id) === el.dataset.id); S.pending = S.pending.filter(x => x !== p); render(); toast(`${p.name}'s sign-up was declined.`); },
  invite: () => openModal(`<h2>Invite to the team</h2><p class="muted small mt-s">Staff, drivers and admins join only by invite.</p>
    <div class="stack mt"><div><label class="f" for="inv-email">Email</label><input id="inv-email" type="email" placeholder="name@themarq.ca"></div><div><label class="f" for="inv-role">Role</label><select id="inv-role"><option>Staff</option><option>Driver</option><option>Admin</option></select></div></div>
    <div class="row mt" style="justify-content:flex-end"><button class="btn" data-act="close">Cancel</button><button class="btn primary" data-act="inviteok">Send invite</button></div>`),
  inviteok: () => { const e = val('inv-email'); if (!e.includes('@')) return toast('Enter an email address.', 'alert'); const r = val('inv-role'); closeModal(); toast(`Invite sent to ${esc(e)} as ${r}.`); },
  tkf: el => { S.tkFilter = el.dataset.v; render(); },
  tksel: el => { S.stTicket = el.dataset.id; render(); },
  tkstatus: el => {
    const t = S.tickets.find(x => x.id === el.dataset.id); const was = t.status; t.status = el.dataset.v;
    if (t.source === 'system' && t.status === 'resolved' && was !== 'resolved') {
      const m = S.machines.find(x => x.id === 'D2'); if (m && m.state === 'fault') m.state = 'free';
      const d = S.devices.find(x => x.hw === t.device); if (d) d.status = 'online';
      toast('Resolved. Dryer 2 is back in service on the laundry page.');
    } else if (t.unit) toast(`${t.name.split(' ')[0]} was notified: ${({open:'reopened', in_progress:'we\'re on it', resolved:'resolved'})[t.status]}.`, 'bell');
    render();
  },
  tkreply: el => {
    const body = val('tk-reply'); if (!body) return;
    const t = S.tickets.find(x => x.id === el.dataset.id); const internal = document.getElementById('tk-internal').checked;
    t.thread.push({who:STAFF.name, body, internal, at:Date.now()}); if (!internal && t.status === 'open') t.status = 'in_progress';
    render(); toast(internal ? 'Internal note added.' : `Reply sent to ${t.name.split(' ')[0]}.`);
  },
  toggleself: el => el.setAttribute('aria-pressed', el.getAttribute('aria-pressed') === 'true' ? 'false' : 'true'),
  anpost: () => {
    const title = val('an-title'), body = val('an-body'); if (!title) return toast('Add a title.', 'alert');
    const aud = val('an-aud'), tgt = val('an-target'), urgent = document.getElementById('an-urgent').getAttribute('aria-pressed') === 'true';
    let floors = [], units = [];
    if (aud === 'floors') { tgt.split(',').forEach(p => { const [a, b] = p.split('-').map(s => parseInt(s, 10)); if (!isNaN(a)) for (let f = a; f <= (isNaN(b) ? a : b); f++) floors.push(f); }); if (!floors.length) return toast('List the floors, e.g. 10-14.', 'alert'); }
    if (aud === 'units') { units = tgt.split(',').map(s => s.trim().padStart(4, '0')).filter(Boolean); if (!units.length) return toast('List the units, e.g. 1204.', 'alert'); }
    const size = aud === 'building' ? 312 : aud === 'floors' ? floors.length * 9 : units.length;
    S.ann.unshift({id:nid(), title, body:body || title, cat:val('an-cat'), urgent, aud, floors, units, at:Date.now(), read:false, reads:0, audSize:size, source:'staff'});
    render(); toast(urgent ? `Published and pushed to ${size} residents.` : `Published to ${size} residents.`, 'mega');
  },
  fstest: () => { S.failsafe = true; S.rooms.forEach(r => { r.mode = 'failsafe'; r.lights = 'on'; r.hvac = 'comfort'; r.set = r.id === 'lobby' ? 21 : 22; }); logCmd('All rooms', 'Lights on, HVAC normal', 'Fail-safe · no heartbeat 120 s'); render(); },
  fsrestore: () => { S.failsafe = false; S.rooms.forEach(r => r.mode = 'auto'); const g = S.rooms.find(r => r.id === 'game'); if (!g.occ) { g.lights = 'off'; g.hvac = 'setback'; g.set = 17; logCmd('Game room', 'Lights off, HVAC setback 17 °C', 'Rule · Empty 10 min after booking'); } render(); toast('Automation restored. Rooms back on their rules.'); },
  rlights: el => { const r = S.rooms.find(x => x.id === el.dataset.id); r.lights = r.lights === 'on' ? 'off' : 'on'; r.mode = 'override'; logCmd(r.name, `Lights ${r.lights} (override)`, `${STAFF.name} (staff)`); render(); },
  rhvac: el => { const r = S.rooms.find(x => x.id === el.dataset.id); r.hvac = r.hvac === 'comfort' ? 'setback' : 'comfort'; r.set = r.hvac === 'comfort' ? 22 : 17; r.mode = 'override'; logCmd(r.name, `HVAC ${r.hvac} ${r.set} °C (override)`, `${STAFF.name} (staff)`); render(); },
  rauto: el => { const r = S.rooms.find(x => x.id === el.dataset.id); r.mode = 'auto'; logCmd(r.name, 'Returned to automatic', `${STAFF.name} (staff)`); render(); toast(`${r.name} is back on automatic.`); },
  devf: el => { S.devFilter = el.dataset.v; render(); },
  calib: el => { const d = S.devices.find(x => x.hw === el.dataset.hw); openModal(`<h2>Calibrate <span class="code">${d.hw}</span></h2><p class="muted small mt-s">Compare with a true-RMS clamp meter under a known load. Applied by the ingest service, so no reflash is needed.</p>
    <div class="tbl-wrap mt"><table><thead><tr><th>Ch</th><th>Scale</th><th>Offset A</th><th>Volts</th><th>PF</th></tr></thead><tbody>${Array.from({length:d.ch}, (_, i) => `<tr><td>${i}</td><td><input value="1.00" aria-label="Scale ch ${i}"></td><td><input value="0.02" aria-label="Offset ch ${i}"></td><td><select aria-label="Voltage ch ${i}"><option>120</option><option ${d.sys === 'Laundry' ? 'selected' : ''}>240</option></select></td><td><input value="${d.sys === 'HVAC' ? '0.85' : '1.00'}" aria-label="Power factor ch ${i}"></td></tr>`).join('')}</tbody></table></div>
    <div class="row mt" style="justify-content:flex-end"><button class="btn" data-act="close">Cancel</button><button class="btn primary" data-act="calibok">Save</button></div>`); },
  calibok: () => { closeModal(); toast('Calibration saved. New readings use it straight away.'); },
  ruletoggle: el => { const r = S.rules.find(x => String(x.id) === el.dataset.id); r.on = !r.on; render(); },
  newrule: () => openModal(`<h2>New rule</h2><div class="stack mt">
    <div><label class="f" for="nr-when">When</label><select id="nr-when"><option>A booking starts</option><option>A booking ends</option><option>Motion in a room with no booking</option><option>No motion for 20 min</option><option>Building load passes 90% of limit</option><option>On-peak price period starts</option></select></div>
    <div><label class="f" for="nr-where">Where</label><select id="nr-where"><option>Theatre, Game room</option><option>Theatre room</option><option>Game room</option><option>Lobby</option><option>All chargers</option></select></div>
    <div><label class="f" for="nr-then">Then</label><select id="nr-then"><option>Lights off · HVAC setback (17 °C)</option><option>Lights on · HVAC comfort (22 °C)</option><option>Alert staff</option><option>Cut EV chargers to 3.6 kW</option></select></div>
    <div class="note">Rules never override a manual override, and wait out a 10-minute cooldown before firing again.</div></div>
    <div class="row mt" style="justify-content:flex-end"><button class="btn" data-act="close">Cancel</button><button class="btn primary" data-act="newruleok">Add rule</button></div>`),
  newruleok: () => { S.rules.push({id:nid(), on:true, when:val('nr-when'), cond:'', then:val('nr-then'), where:val('nr-where'), fired:Date.now()}); closeModal(); render(); toast('Rule added and switched on.'); },
  anr: el => { S.anRange = el.dataset.v; render(); },
  toast: el => toast(el.dataset.msg, 'check'),
};
function markRead(a){ if (a && !a.read) { a.read = true; a.reads++; } }
function scrollPhone(){ const b = document.getElementById('pbody'); if (b) b.scrollTop = 0; }
document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]'); if (!el || el.disabled) return;
  const fn = A[el.dataset.act]; if (fn) { e.preventDefault(); fn(el, e); }
});

/* ===== live updates ===== */
function afterRender(){
  const path = document.getElementById('route-path');
  if (path) {
    const len = path.getTotalLength();
    STOPS.forEach((s, i) => {
      const g = document.getElementById('stop-' + i); if (!g) return;
      const pt = path.getPointAtLength(s.at * len); g.setAttribute('transform', `translate(${pt.x.toFixed(1)} ${pt.y.toFixed(1)})`);
      const t = g.querySelector('text'); const right = pt.x > 200;
      t.setAttribute('x', right ? -10 : 10); t.setAttribute('y', pt.y < 100 ? -9 : 14); t.setAttribute('text-anchor', right ? 'end' : 'start');
    });
  }
  updateLive();
}
function updateLive(){
  const sh = S.shuttle;
  const path = document.getElementById('route-path'), bus = document.getElementById('bus');
  if (path && bus && sh.running) { const pt = path.getPointAtLength(sh.p * path.getTotalLength()); bus.setAttribute('transform', `translate(${pt.x.toFixed(1)} ${pt.y.toFixed(1)})`); }
  STOPS.forEach((s, i) => { const el = document.getElementById('eta-' + i); if (el) el.textContent = etaText(etaMin(i)); });
  const he = document.getElementById('home-eta'); if (he) he.innerHTML = homeEta();
  const de = document.getElementById('drv-elapsed'); if (de) de.textContent = elapsed();
  const dn = document.getElementById('drv-next'); if (dn) { const i = nextStopIdx(); dn.textContent = STOPS[i].name; document.getElementById('drv-eta').textContent = 'in ' + etaText(etaMin(i) - sh.delay); }
  const ol = document.getElementById('ov-load'); if (ol) { ol.textContent = S.load; document.getElementById('ov-meter').style.width = (S.load/LIMIT*100) + '%'; }
  const el = document.getElementById('en-load'); if (el) el.textContent = S.load;
}
let tick = 0;
setInterval(() => {
  tick++;
  const sh = S.shuttle;
  if (sh.running) {
    sh.p += 1/180;
    if (sh.p >= 1) { sh.p -= 1; sh.notifiedLoop = false; }
    const m = etaMin(0);
    if (sh.notify5 && !sh.notifiedLoop && m <= 5 && m > 0.5) { sh.notifiedLoop = true; if (S.role === 'resident') toast('Shuttle is about 5 min from The Marq.', 'bus'); }
  }
  if (tick % 3 === 0) S.load = Math.round(92 + 8*Math.sin(tick/9) + 3*noise(tick));
  if (tick % 8 === 0) {
    let changed = false;
    S.machines.forEach(m => {
      if (m.state !== 'in_use' && m.state !== 'finishing') return;
      m.mins = Math.max(0, m.mins - 1); changed = true;
      if (m.mins === 0) {
        m.state = 'free';
        if (S.laundryNotify.has(m.id)) { S.laundryNotify.delete(m.id); toast(`${m.type} ${m.id.slice(1)} is done.`, 'washer'); }
      } else if (m.mins <= 5) m.state = 'finishing';
    });
    if (changed && ((S.role === 'resident' && !S.rview && (S.rtab === 'laundry' || S.rtab === 'home')) || (S.role === 'staff' && S.stab === 'overview'))) render();
  }
  updateLive();
}, 1000);

/* ===== start ===== */
try { const t = localStorage.getItem('marq-theme'); if (t === 'dark' || t === 'light') document.documentElement.setAttribute('data-theme', t); } catch (e) {}
S.machines.forEach(m => { if (m.state === 'in_use' && m.mins <= 5) m.state = 'finishing'; });
render();
</script>
