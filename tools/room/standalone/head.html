<title>2:47 AM Room</title>
<style>
/* Layout: one full-bleed WebGL stage with a quiet overlay at top and bottom. Single dark look by design. */
:root { --ground: #030407; --ink: rgba(240,236,228,.85); --ink-dim: rgba(240,236,228,.45); --amber: #f2b36b; --chip: rgba(10,10,14,.55); color-scheme: dark;
  --mono: ui-monospace, "SFMono-Regular", Menlo, monospace; --sans: system-ui, -apple-system, "Segoe UI", sans-serif; }
[hidden] { display: none !important; }
html, body { height: 100%; }
body { background: var(--ground); color: var(--ink); font-family: var(--sans); overflow: hidden; }
#stage { position: fixed; inset: 0; }
.top, .bottom { position: fixed; left: 0; right: 0; padding-inline: 16px; pointer-events: none; display: flex; }
.top { justify-content: space-between !important; align-items: flex-start; } .top { top: 0; padding-top: calc(16px + env(safe-area-inset-top, 0px)); justify-content: flex-end; }
.bottom { bottom: 0; padding-bottom: calc(18px + env(safe-area-inset-bottom, 0px)); flex-direction: column; align-items: center; gap: 8px; }
.clock { text-align: right; }
.clock b { display: block; font: 500 12px var(--mono); letter-spacing: .25em; color: var(--amber); opacity: .8; }
.clock span { font-size: 13px; color: var(--ink-dim); }
.row { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; }
#toggle, #lamp, #scope, #leave, #lights, #radio, #sub { display: block; }
#mute { pointer-events: auto; font: 500 14px var(--sans); color: var(--ink); background: var(--chip); border: 1px solid rgba(255,255,255,.08); border-radius: 999px; padding: 10px 20px; cursor: pointer; backdrop-filter: blur(8px); }
#lamp[aria-pressed="true"], #radio[aria-pressed="true"] { color: var(--amber); }
#toggle:hover, #lamp:hover, #scope:hover, #leave:hover, #lights:hover, #radio:hover, #mute:hover { color: #fff; }
#toggle:focus-visible, #lamp:focus-visible, #scope:focus-visible, #leave:focus-visible, #lights:focus-visible, #panel button:focus-visible, #panel input:focus-visible { outline: 2px solid var(--amber); outline-offset: 3px; }
#pwrap { position: fixed; top: calc(80px + env(safe-area-inset-top, 0px)); bottom: 288px; left: 16px; right: 16px; display: flex; align-items: flex-end; justify-content: center; pointer-events: none; }
@media (min-width: 640px) { #pwrap { left: auto; right: 24px; bottom: 144px; align-items: flex-start; } }
#panel { pointer-events: auto; width: 100%; max-width: 340px; max-height: 100%; overflow-y: auto; overscroll-behavior: contain; box-sizing: border-box; padding: 20px; border-radius: 16px; border: 1px solid rgba(255,255,255,.1); background: rgba(13,11,10,.78); backdrop-filter: blur(20px); color: var(--ink); box-shadow: 0 20px 60px rgba(0,0,0,.5); }
#panel[hidden] { display: none; }
.ph { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
.eyebrow { margin: 0; font: 500 11px var(--mono); letter-spacing: .2em; text-transform: uppercase; color: var(--amber); opacity: .75; }
#panel h2 { margin: 2px 0 0; font-size: 18px; font-weight: 600; color: #fff; }
#pclose { background: none; border: 0; color: var(--ink-dim); font-size: 16px; cursor: pointer; padding: 6px; border-radius: 999px; }
#pclose:hover { color: #fff; background: rgba(255,255,255,.08); }
#presets { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 18px; }
.chip-s { font: 12px var(--sans); color: rgba(255,255,255,.72); background: none; border: 1px solid rgba(255,255,255,.12); border-radius: 999px; padding: 5px 12px; cursor: pointer; }
.chip-s:hover { color: #fff; border-color: rgba(255,255,255,.3); }
.chip-s[aria-pressed="true"] { color: #ffe9c7; border-color: rgba(242,179,107,.6); background: rgba(242,179,107,.15); }
#sliders { display: grid; gap: 16px; }
.row-s { display: grid; gap: 8px; font-size: 14px; color: rgba(255,255,255,.8); }
.row-h { display: flex; justify-content: space-between; align-items: baseline; }
.val { font: 12px var(--mono); color: var(--ink-dim); font-variant-numeric: tabular-nums; }
#panel input[type=range] { -webkit-appearance: none; appearance: none; width: 100%; height: 6px; border-radius: 999px; background: rgba(255,255,255,.15); accent-color: var(--amber); margin: 0; }
#panel input.temp { background: linear-gradient(90deg, rgba(125,211,252,.7), rgba(255,255,255,.4), rgba(251,191,36,.8)); }
#panel input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 16px; height: 16px; border-radius: 50%; background: #fff1d6; border: 1px solid #ffd9a0; box-shadow: 0 0 12px rgba(255,190,110,.6); cursor: pointer; }
#panel input[type=range]::-moz-range-thumb { width: 16px; height: 16px; border-radius: 50%; background: #fff1d6; border: 1px solid #ffd9a0; cursor: pointer; }
.swatches { display: flex; flex-wrap: wrap; gap: 8px; }
.swatch { width: 28px; height: 28px; border-radius: 50%; border: 2px solid rgba(255,255,255,.15); cursor: pointer; padding: 0; transition: transform .15s; }
.swatch:hover { transform: scale(1.1); }
.swatch[aria-checked="true"] { border-color: #fff; transform: scale(1.1); }
.toggle { grid-auto-flow: column; justify-content: space-between; align-items: center; margin-top: 16px; }
#candle { width: 40px; height: 22px; accent-color: var(--amber); cursor: pointer; }
#mute { pointer-events: auto; font-size: 13px !important; padding: 8px 14px !important; }
#mute[aria-pressed="false"] { color: var(--ink-dim); }
#onair { pointer-events: auto; margin-top: 8px; display: inline-flex; align-items: center; gap: 6px; font: 12px var(--sans); color: #ffe9c7; background: var(--chip); border: 0; border-radius: 999px; padding: 4px 10px; cursor: pointer; }
#onair i { width: 6px; height: 6px; border-radius: 50%; background: var(--amber); box-shadow: 0 0 8px var(--amber); animation: blink 1.4s ease-in-out infinite; }
@keyframes blink { 50% { opacity: .35; } }
@media (prefers-reduced-motion: reduce) { #onair i { animation: none; } }
#notewrap { position: fixed; top: calc(80px + env(safe-area-inset-top, 0px)); left: 0; right: 0; display: flex; justify-content: center; padding-inline: 16px; pointer-events: none; }
#note { pointer-events: auto; transform: rotate(-1.5deg); width: min(88vw, 300px); text-align: left; background: #f6e7b0; color: #3a2e12; border: 0; border-radius: 2px; padding: 16px 20px; box-shadow: 0 12px 30px rgba(0,0,0,.45); cursor: pointer; animation: notein .7s ease-out; }
@keyframes notein { from { opacity: 0; margin-top: -8px; } }
#note small { display: block; margin-bottom: 4px; font: 500 10px var(--mono); letter-spacing: .2em; text-transform: uppercase; color: #8a6a1c; }
#note em { font: italic 16px/1.35 Georgia, serif; }
.outside { display: grid; gap: 16px; margin-top: 16px; padding-top: 16px; border-top: 1px solid rgba(255,255,255,.1); }
.eyebrow.dim { color: rgba(255,255,255,.4); opacity: 1; }
.segs { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; gap: 4px; padding: 4px; border-radius: 999px; border: 1px solid rgba(255,255,255,.1); background: rgba(255,255,255,.05); }
.seg { font: 12px var(--sans); color: rgba(255,255,255,.6); background: none; border: 0; border-radius: 999px; padding: 5px 6px; cursor: pointer; }
.seg:hover { color: #fff; }
.seg[aria-checked="true"] { color: #ffe9c7; background: rgba(242,179,107,.2); }
#label { position: fixed; left: 0; right: 0; top: 12%; padding-inline: 16px; text-align: center; pointer-events: none; opacity: 0; transition: opacity .5s; }
#label.on { opacity: 1; }
#lname { margin: 0; font: 400 clamp(20px, 3vw, 26px)/1.2 Georgia, "Times New Roman", serif; letter-spacing: .02em; color: var(--ink); }
#ldetail { margin: 4px 0 0; font-size: 13px; color: rgba(214,190,255,.75); }
#hint { text-align: center;  font-size: 12px; color: var(--ink-dim); }
#err { position: fixed; inset: 0; display: grid; place-items: center; padding: 16px; text-align: center; color: var(--ink-dim); }
</style>
<div id="stage"></div>
<div id="err" hidden>This browser couldn't start WebGL, so the 3D room can't be shown.</div>
<div class="top"><button id="mute" type="button" aria-pressed="true">Sound on</button><div class="clock"><b>2:47 AM</b><span id="sub">still building.</span><button id="onair" type="button" hidden title="Turn the radio off"><i></i><span id="station"></span></button></div></div>
<div id="notewrap"><button id="note" type="button" hidden aria-live="polite" title="Dismiss"><small>A note on the door</small><em id="notetext"></em></button></div>
<div id="pwrap"><section id="panel" role="dialog" aria-label="Lighting" hidden>
<div class="ph"><div><p class="eyebrow">Light switch</p><h2>Lighting &amp; weather</h2></div><button id="pclose" type="button" aria-label="Close lighting">✕</button></div>
<div id="presets"></div>
<div id="sliders"></div>
<label class="row-s toggle"><span>Candle</span><input id="candle" type="checkbox" role="switch" checked></label>
<div class="outside"><p class="eyebrow dim">Outside</p>
<div class="row-s"><span>Time of day</span><div id="times" class="segs" role="radiogroup" aria-label="Time of day"></div></div>
<div class="row-s"><span>Weather</span><div id="weathers" class="segs" role="radiogroup" aria-label="Weather"></div></div></div>
</section></div>
<div id="label" hidden aria-live="polite"><p id="lname">&nbsp;</p><p id="ldetail">&nbsp;</p></div>
<div class="bottom"><div class="row"><button id="toggle" type="button">Step inside</button><button id="scope" type="button">Look through the telescope</button><button id="lights" type="button" aria-expanded="false">Lighting &amp; weather</button><button id="radio" type="button" aria-pressed="false">Radio</button><button id="lamp" type="button" aria-pressed="true">Lamp on</button><button id="leave" type="button" hidden>Step back from the telescope</button></div><div id="hint">Move your cursor to lean in · click the light switch, the lamp (L), the telescope (T), or the cat</div></div>
<script>
