<title>My Room, Plain</title>
<style>
/* One full-bleed WebGL stage with a row of view buttons. A single dark look, matching the scene. */
:root { --ground: #0d0e11; --ink: rgba(240,236,228,.85); --ink-dim: rgba(240,236,228,.5); --amber: #f2b36b; color-scheme: dark; }
html, body { height: 100%; margin: 0; }
:root { background: var(--ground); }
body { background: var(--ground); color: var(--ink); font-family: system-ui, -apple-system, "Segoe UI", sans-serif; overflow: hidden; }
#stage { position: fixed; inset: 0; }
.bar { position: fixed; left: 0; right: 0; bottom: 0; padding: 16px 16px calc(20px + env(safe-area-inset-bottom, 0px)); display: flex; flex-direction: column; align-items: center; gap: 8px; pointer-events: none; }
.row { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; }
button { pointer-events: auto; font: 500 14px inherit; font-family: inherit; color: var(--ink); background: rgba(10,10,14,.55); border: 1px solid rgba(255,255,255,.08); border-radius: 999px; padding: 9px 18px; cursor: pointer; backdrop-filter: blur(8px); }
button:hover { color: #fff; }
button[aria-pressed="true"] { color: var(--amber); border-color: rgba(242,179,107,.4); }
button:focus-visible { outline: 2px solid var(--amber); outline-offset: 3px; }
.hint { margin: 0; font-size: 12px; color: var(--ink-dim); }
</style>
<div id="stage"></div>
<div class="bar">
  <div class="row">
    <button type="button" data-view="photo" aria-pressed="true">Photo view</button>
    <button type="button" data-view="desk" aria-pressed="false">Desk</button>
    <button type="button" data-view="dollhouse" aria-pressed="false">Dollhouse</button>
  </div>
  <p class="hint">Drag to orbit · scroll to zoom · right-drag to pan</p>
</div>
